[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuverify-backend"
version = "0.1.0"
description = "DocuVerify shipping document verification API scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "pypdfium2>=4.30,<6",
    "Pillow>=11,<13",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "pypdf>=5,<7",
    "torch>=2.6,<3",
    "transformers>=5,<6",
    "google-genai>=2.3,<3",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
